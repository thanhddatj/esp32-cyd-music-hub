name: Build firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Cai PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run

      - name: Gom file bin
        run: |
          mkdir out
          B=.pio/build/cyd
          P=~/.platformio/packages
          # 1) Chi phan firmware (dung cho OTA hoac nap tai 0x10000)
          cp $B/firmware.bin out/music-hub-app.bin
          # 2) Ban day du (nap tai dia chi 0x0 cho board moi hoac xoa sach)
          python $P/tool-esptoolpy/esptool.py --chip esp32 merge_bin \
            -o out/music-hub-full.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 $P/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/*.bin

      - name: Tao Release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.bin
