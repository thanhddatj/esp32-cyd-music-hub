[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    h2zero/NimBLE-Arduino@^1.4.3
build_flags =
    -DUSER_SETUP_LOADED=1
    ; Neu man hinh bi sai mau / trang xoa: doi ILI9341_2_DRIVER -> ST7789_DRIVER va them -DTFT_INVERSION_ON
    -DST7789_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
