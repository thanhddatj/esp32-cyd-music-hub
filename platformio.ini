[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; ── Libraries ───────────────────────────────────────────────
lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  me-no-dev/ESPAsyncWebServer @ ^1.2.3
  me-no-dev/AsyncTCP @ ^1.1.1

; ── Build flags ─────────────────────────────────────────────
; TFT_eSPI driver for ESP32-3248S035 (ILI9488, 480x320)
build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9488_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D TOUCH_CS=33
  -D SPI_FREQUENCY=27000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1

; ── OTA / Partition ─────────────────────────────────────────
board_build.partitions = partitions_ota.csv
board_upload.flash_size = 4MB

monitor_speed = 115200
upload_speed  = 921600
